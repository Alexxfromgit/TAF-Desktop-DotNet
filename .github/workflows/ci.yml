name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and static checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (framework, demo apps, tests)
        run: dotnet build -c Release

      - name: Framework unit tests (no app needed)
        run: dotnet test tests/Taf.Desktop.Core.Tests -c Release --no-build

      - name: Static checks of the example tests (linter)
        run: dotnet test examples/Taf.Desktop.Examples -c Release --no-build --filter TestCategory=static
