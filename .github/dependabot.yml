version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # FluentAssertions 8+ is commercially licensed; stay on the Apache-2.0 7.x line.
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
